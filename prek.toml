default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
# Hooks without their own `stages` run on these only. Without this they
# would also run at commit-msg, so every commit ran the checks twice.
default_stages = ["pre-commit", "pre-push"]

# Generic file hygiene --------------------------------------------------------
# Hooks that edit files run on pre-commit only: run again on pre-push, an
# edit would be left as an uncommitted change after the push is rejected.
# The checks run on pre-push too, as a safety net after `--no-verify`.
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "no-commit-to-branch" },
  { id = "trailing-whitespace", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"] },
  { id = "mixed-line-ending", args = ["--fix=lf"], stages = ["pre-commit"] },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-yaml" },
  # Notebooks are JSON too, but Jupyter writes them with 1-space indents.
  { id = "pretty-format-json", args = ["--autofix", "--indent=4", "--no-ensure-ascii"], stages = ["pre-commit"], exclude = "\\.ipynb$" },
]

# Commit message / branch conventions -----------------------------------------
[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.13.10"
hooks = [
  { id = "commitizen", stages = ["commit-msg"] },
  { id = "commitizen-branch", stages = ["pre-push"] },
]

# Secret scanning — rev kept in sync with the install snippet in README.md
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks" }]

# Local project hooks (delegated to justfile) ---------------------------------
[[repos]]
repo = "local"

# Format: ruff isort fixes + ruff format
[[repos.hooks]]
id = "ruff-format"
name = "ruff-format"
entry = "just format"
language = "system"
types = ["python"]
stages = ["pre-commit"]

# Pre-push twins of ruff-format, which fixes on pre-commit only: the same
# lint and format checks, without fixing, as a safety net after
# `git commit --no-verify`.
[[repos.hooks]]
id = "check-ruff"
name = "check-ruff"
entry = "just check-ruff"
language = "system"
types = ["python"]
stages = ["pre-push"]

[[repos.hooks]]
id = "check-format"
name = "check-format"
entry = "just check-format"
language = "system"
types = ["python"]
stages = ["pre-push"]

# Static type checking via mypy
[[repos.hooks]]
id = "check-types"
name = "check-types"
entry = "just check-types"
language = "system"
types = ["python"]
# mypy follows imports, so it checks the whole project, not just the
# files prek passes (a change in one file can break types in another).
pass_filenames = false

# Cyclomatic complexity via complexipy
[[repos.hooks]]
id = "check-complexity"
name = "check-complexity"
entry = "just check-complexity"
language = "system"
types = ["python"]

# Spell checking — a venv dependency like the tools above, so it's a single
# pin (pyproject.toml) rather than a second one to keep in sync here.
[[repos.hooks]]
id = "check-spelling"
name = "check-spelling"
entry = "just check-spelling"
language = "system"

# Catches drift between this file's gitleaks pin and what's actually
# installed (gitleaks isn't a venv dependency, so this is its only check).
[[repos.hooks]]
id = "check-versions-sync"
name = "check-versions-sync"
entry = "just check-versions-sync"
language = "system"
always_run = true
pass_filenames = false
